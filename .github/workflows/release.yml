# Builds one-file programs for Windows, Linux and macOS and attaches them to a GitHub Release.
# Trigger: push a tag like v1.0.0  (git tag v1.0.0 && git push origin v1.0.0), or run it by hand from the Actions tab.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/core.test.js
      - run: node tests/review.test.js
      - run: node tests/puzzles.test.js
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install zstandard   # unpacks the optional lichess puzzle download (Python 3.14+ has it built in)
      - run: python -m py_compile server.py uci.py puzzledb.py tools/bundle_stockfish.py tools/smoke_test.py
      - run: python tests/test_puzzledb.py

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: ai-chess-windows.exe
            sep: ";"
          - os: ubuntu-latest
            asset: ai-chess-linux
            sep: ":"
          - os: macos-latest
            asset: ai-chess-macos
            sep: ":"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pillow zstandard   # pillow turns the .ico into the macOS .icns; zstandard unpacks the puzzle download
      - name: Stockfish for this system (shipped inside the program)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/bundle_stockfish.py bundle
      - name: Build
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name ai-chess --icon assets/ai-chess.ico --add-data "web${{ matrix.sep }}web" --add-data "bundle/stockfish${{ matrix.sep }}engines/stockfish" --exclude-module zstandard.backend_cffi --exclude-module zstandard._cffi server.py
          if [ -f dist/ai-chess.exe ]; then mv dist/ai-chess.exe "dist/${{ matrix.asset }}"; else mv dist/ai-chess "dist/${{ matrix.asset }}"; fi
          ls -la dist
      - name: Smoke test (starts the program, checks the page and the included Stockfish)
        shell: bash
        run: python tools/smoke_test.py "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
