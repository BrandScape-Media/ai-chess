<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chess</title>
<meta name="description" content="Play chess against your local AI models, chess engines, or let them play each other.">
<link rel="icon" href="favicon.svg">
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<style id="pieceCss"></style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Main">
    <a class="brand" href="#" data-tab="play"><img src="pieces/cburnett/wN.svg" alt=""><span>AI Chess</span></a>
    <button class="railbtn" data-tab="play" data-ic="play"><span class="lbl">Play</span></button>
    <button class="railbtn" data-tab="new" data-ic="plus"><span class="lbl">New game</span></button>
    <button class="railbtn" data-tab="history" data-ic="clock-counter-clockwise"><span class="lbl">History</span></button>
    <button class="railbtn" id="bSettings" data-ic="gear-six"><span class="lbl">Settings</span></button>
    <span class="grow"></span>
    <a class="railbtn small" href="https://github.com/BrandScape-Media/ai-chess" target="_blank" rel="noopener" data-ic="github-logo"><span class="lbl">GitHub</span></a>
  </nav>

  <main class="stage">
    <div class="player" id="stripTop">
      <div class="avatar" id="avTop"></div>
      <div class="pinfo">
        <div class="pline"><span class="name" id="nameTop"></span><span class="rating" id="ratingTop"></span><button class="lvl" id="lvlTop" hidden></button><span class="flagbadge" id="badgeTop"></span></div>
        <div class="pline sub"><span class="caps" id="capsTop"></span><span class="adv" id="advTop"></span></div>
      </div>
      <div class="clock" id="clockTop" hidden></div>
    </div>
    <div class="boardwrap">
      <div id="evalbar" hidden aria-label="Evaluation"><div class="fill"></div><span class="ev"></span></div>
      <div id="board"></div>
      <div id="result" hidden></div>
    </div>
    <div class="player" id="stripBot">
      <div class="avatar" id="avBot"></div>
      <div class="pinfo">
        <div class="pline"><span class="name" id="nameBot"></span><span class="rating" id="ratingBot"></span><button class="lvl" id="lvlBot" hidden></button><span class="flagbadge" id="badgeBot"></span></div>
        <div class="pline sub"><span class="caps" id="capsBot"></span><span class="adv" id="advBot"></span></div>
      </div>
      <div class="clock" id="clockBot" hidden></div>
    </div>
  </main>

  <aside class="panel" aria-label="Game">
    <div class="ptabs" role="tablist">
      <button data-tab="play" class="on" data-ic="list-numbers">Moves</button>
      <button data-tab="new" data-ic="plus">New game</button>
      <button data-tab="chat" data-ic="chat-circle-text">Chat<span class="badge" id="chatBadge"></span></button>
    </div>

    <section class="tab" id="tab-play">
      <div class="statusbar"><div id="status"></div><div id="einfo"></div><div id="eline" hidden></div></div>
      <div id="bubble" hidden></div>
      <div id="moves"></div>
      <div class="navrow">
        <button class="ib" id="bFirst" title="First move (Home)" data-ic="caret-double-left"></button>
        <button class="ib" id="bPrev" title="Previous move (Left arrow)" data-ic="caret-left"></button>
        <button class="ib" id="bNext" title="Next move (Right arrow)" data-ic="caret-right"></button>
        <button class="ib" id="bLast" title="Last move (End)" data-ic="caret-double-right"></button>
        <span class="gap"></span>
        <button class="ib" id="bOpts" title="Game options: evaluation bar, move feedback, arrows" data-ic="gear-six"></button>
        <button class="ib" id="bFlip" title="Flip the board (F)" data-ic="arrows-down-up"></button>
        <button class="ib" id="bFen" title="Copy FEN" data-ic="copy"></button>
        <button class="ib txt" id="bPgn" title="Copy PGN">PGN</button>
      </div>
      <div class="actions">
        <button id="bHint" hidden title="Show the best move (H)" data-ic="lightbulb">Hint</button>
        <button id="bUndo" title="Take back the last move" data-ic="arrow-counter-clockwise">Undo</button>
        <button id="bPause" hidden title="Pause or resume the computer players (P)" data-ic="pause">Pause</button>
        <button id="bResign" data-ic="flag">Resign</button>
      </div>
    </section>

    <section class="tab setup" id="tab-new" hidden>
      <div class="setupBody">
        <div class="matchup" id="matchup" aria-live="polite"></div>

        <div class="sidepick" id="sidePick">
          <span class="splbl">Play as</span>
          <div class="seg" role="radiogroup" aria-label="Your colour" id="colorSeg">
            <button type="button" data-c="w" title="Play White"><img src="pieces/cburnett/wK.svg" alt=""><span>White</span></button>
            <button type="button" data-c="r" title="Random colour each game" data-ic="shuffle"><span>Random</span></button>
            <button type="button" data-c="b" title="Play Black"><img src="pieces/cburnett/bK.svg" alt=""><span>Black</span></button>
          </div>
          <button class="ib" id="bSwap" type="button" title="Swap the White and Black players" data-ic="arrows-down-up"></button>
          <input type="checkbox" id="rnd" hidden>
        </div>
        <div class="seat" id="seat0"></div>
        <div class="seat" id="seat1"></div>

        <section class="sect">
          <h3 class="gh">Time control</h3>
          <div class="tcpick" id="tcPick" role="radiogroup" aria-label="Time control"></div>
          <input type="hidden" id="tc" value="0">
          <label class="swrow" id="tcAIrow" title="Engines are always on the clock. A slow local model can lose on time in a fast game."><span class="ic" data-ic="hourglass-medium"></span><span class="t">AI models play without a clock<small>for slow local models</small></span><input type="checkbox" class="switch" id="tcLLM"></label>
        </section>

        <section class="sect">
          <h3 class="gh">Game</h3>
          <div class="set">
            <label for="variant">Variant</label>
            <select id="variant"><option value="0">Standard chess</option><option value="1">King of the Hill</option><option value="2">Three-check</option></select>
            <label for="start">Start</label>
            <select id="start"><option value="std">Standard position</option><option value="960">Chess960 (Fischer Random)</option><option value="trans">Transcendental (each side shuffled)</option><option value="fen">Custom FEN</option></select>
            <label id="fenLabel" for="fenIn">FEN</label>
            <input id="fenIn" type="text" spellcheck="false" placeholder="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
          </div>
        </section>

        <section class="sect">
          <h3 class="gh">While you play <small>can be changed during the game too</small></h3>
          <div class="switches" id="assistSw"></div>
        </section>

        <section class="sect">
          <h3 class="gh">House rules</h3>
          <div class="switches">
            <label class="swrow" title="A Hint button shows the best move"><span class="ic" data-ic="lightbulb"></span><span class="t">Hints<small>a button that shows the best move</small></span><input type="checkbox" class="switch" id="allowHints" checked></label>
            <label class="swrow" title="Allow taking moves back against the computer"><span class="ic" data-ic="arrow-counter-clockwise"></span><span class="t">Takebacks<small>undo your last move</small></span><input type="checkbox" class="switch" id="allowUndo" checked></label>
            <label class="swrow" title="The other side sees your arrows and circles, and is told you don't know it can"><span class="ic" data-ic="eye"></span><span class="t">Opponent can peek at my arrows<small>bluff with your drawings</small></span><input type="checkbox" class="switch" id="peek"></label>
            <label class="swrow" title="Off: everybody plays by the rules. On: each side has its own switch; illegal moves are played as-is and nobody is told."><span class="ic" data-ic="warning-diamond"></span><span class="t">Allow illegal moves<small>pieces may teleport, come back or appear</small></span><input type="checkbox" class="switch" id="chaos"></label>
          </div>
        </section>
        <div class="hint" id="hint"></div>
      </div>
      <div class="startbar"><button class="primary" id="bNew" data-ic="play">Start game</button></div>
    </section>

    <section class="tab history" id="tab-history" hidden>
      <div class="histhead"><h2>Game history</h2><div id="histStats"></div></div>
      <div id="histList"></div>
    </section>

    <section class="tab chat" id="tab-chat" hidden>
      <div id="chatLog"></div>
      <form id="chatForm" autocomplete="off"><input id="chatIn" type="text" maxlength="300" placeholder="Message your opponent" aria-label="Chat message"><button class="ib" title="Send" data-ic="paper-plane-tilt"></button></form>
    </section>
  </aside>
</div>
<div id="strengthPop" class="pop" hidden role="dialog" aria-label="Engine strength"></div>
<div id="optsPop" class="pop" hidden role="dialog" aria-label="Game options"></div>
<div id="promo" hidden><div class="box" id="promoBox"></div></div>
<dialog id="settings"></dialog>
<div id="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
