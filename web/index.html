<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Chess</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="app.css">
<style id="pieceCss"></style>
</head>
<body>
<div class="app">
  <div class="left">
    <div class="strip" id="stripTop"><span class="dot"></span><span class="name" id="nameTop"></span><span class="caps" id="capsTop"></span><span class="adv" id="advTop"></span></div>
    <div id="board"></div>
    <div class="strip" id="stripBot"><span class="dot"></span><span class="name" id="nameBot"></span><span class="caps" id="capsBot"></span><span class="adv" id="advBot"></span></div>
  </div>
  <aside class="side">
    <header class="top"><h1>&#9822; AI Chess</h1><small id="modeTag"></small><button class="icon" id="bSettings" title="Settings">&#9881;</button></header>
    <div id="status"></div>
    <div id="einfo"></div>
    <div id="bubble" hidden></div>
    <div class="tabs"><button data-tab="moves" class="on">Moves</button><button data-tab="chat">Chat<span class="badge" id="chatBadge"></span></button></div>
    <div id="moves"></div>
    <div id="chat" hidden>
      <div id="chatLog"></div>
      <form id="chatForm" autocomplete="off"><input id="chatIn" type="text" maxlength="300" placeholder="Say something…"><button>Send</button></form>
    </div>
    <div class="row">
      <button id="bUndo" title="Take back the last move (back to your turn)">Undo</button>
      <button id="bFlip" title="Flip board (F)">Flip</button>
      <button id="bResign">Resign</button>
      <button id="bPause" hidden title="Pause / resume the computer players (P)">Pause</button>
      <button id="bHint" hidden title="Show the best move (H)">&#128161; Hint</button>
    </div>
    <div class="row nav">
      <button id="bFirst" title="Home">&#9198;</button><button id="bPrev" title="Left arrow">&#9664;</button><button id="bNext" title="Right arrow">&#9654;</button><button id="bLast" title="End">&#9197;</button>
      <span class="grow"></span>
      <button id="bFen" title="Copy FEN">FEN</button><button id="bPgn" title="Copy PGN">PGN</button>
    </div>
    <details class="setup" id="setup" open>
      <summary>Game setup</summary>
      <div class="setupBody">
        <div class="set">
          <label>Variant</label>
          <select id="variant"><option value="0">Standard chess</option><option value="1">King of the Hill</option><option value="2">Three-check</option></select>
          <label>Start</label>
          <select id="start"><option value="std">Standard position</option><option value="960">Chess960 (Fischer Random)</option><option value="trans">Transcendental (each side shuffled)</option><option value="fen">Custom FEN…</option></select>
          <label id="fenLabel">FEN</label>
          <input id="fenIn" type="text" spellcheck="false" placeholder="rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1">
        </div>
        <label class="chk" title="Off: everybody plays by the rules (illegal moves from AI players are bounced back to them). On: each side has its own switch; illegal moves just happen and nobody is told."><input type="checkbox" id="chaos"> Allow illegal moves (chaos mode)</label>
        <div class="seat" id="seat0"></div>
        <div class="seat" id="seat1"></div>
        <div class="row"><label class="chk" title="A Hint button shows the best move (uses Stockfish if installed)"><input type="checkbox" id="allowHints" checked> Hints</label>
          <label class="chk" title="Allow taking moves back with Undo when playing against the computer"><input type="checkbox" id="allowUndo" checked> Takebacks</label></div>
        <label class="chk" title="The other side gets your arrows and circles in its prompt (or picture) and is told you don't know it can see them. Draw honest plans, or bait."><input type="checkbox" id="peek"> Opponent can peek at my arrows (sneaky)</label>
        <div class="row"><button class="primary grow" id="bNew">New game</button><button id="bSwap" title="Swap the White and Black players">&#8645; Swap</button><label class="chk" title="Swap sides at random when starting"><input type="checkbox" id="rnd"> random</label></div>
        <div class="hint" id="hint"></div>
      </div>
    </details>
  </aside>
</div>
<div id="promo" hidden><div class="box" id="promoBox"></div></div>
<dialog id="settings"></dialog>
<div id="toast"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
